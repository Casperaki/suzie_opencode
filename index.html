<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gameCanvas {
            border: 4px solid #4a4a6a;
            border-radius: 4px;
            image-rendering: pixelated;
        }

        #ui {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: #fff;
            font-size: 18px;
            text-shadow: 2px 2px #000;
        }

        .lives { color: #4ade80; }
        .score { color: #fbbf24; }
        .time { color: #f87171; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <span class="lives">LIVES: <span id="livesDisplay">3</span></span>
            <span class="score">SCORE: <span id="scoreDisplay">0</span></span>
            <span class="time">TIME: <span id="timeDisplay">60</span></span>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const GRID = 50;
        const COLS = 13;
        const ROWS = 13;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = COLS * GRID;
        canvas.height = ROWS * GRID;

        const livesEl = document.getElementById('livesDisplay');
        const scoreEl = document.getElementById('scoreDisplay');
        const timeEl = document.getElementById('timeDisplay');

        // Game state
        let state = 'start'; // start, playing, paused, gameover, win
        let score = 0;
        let lives = 3;
        let timeLeft = 60;
        let timeAcc = 0;
        let goals = [false, false, false, false, false];

        // Frog
        let frog = {
            gridX: 6, gridY: 12,
            x: 6 * GRID, y: 12 * GRID,
            moving: false, progress: 0,
            fromX: 0, fromY: 0,
            hop: 0
        };

        // Moving objects
        let cars = [], logs = [], turtles = [];
        let turtleAnim = 0;

        function scaleCanvas() {
            const scale = Math.min(
                (window.innerWidth - 40) / canvas.width,
                (window.innerHeight - 100) / canvas.height
            );
            canvas.style.width = (canvas.width * scale) + 'px';
            canvas.style.height = (canvas.height * scale) + 'px';
        }

        function resetLevel() {
            frog.gridX = 6;
            frog.gridY = 12;
            frog.x = 6 * GRID;
            frog.y = 12 * GRID;
            frog.moving = false;
            frog.progress = 0;
            frog.hop = 0;
            timeLeft = 60;
            spawnObjects();
        }

        function resetGame() {
            score = 0;
            lives = 3;
            goals = [false, false, false, false, false];
            resetLevel();
            updateUI();
        }

        function spawnObjects() {
            cars = [];
            logs = [];
            turtles = [];

            // Road lanes (rows 7-11)
            const roadConfigs = [
                { row: 7, speed: -3, type: 'car' },
                { row: 8, speed: 1.5, type: 'truck' },
                { row: 9, speed: -2, type: 'car' },
                { row: 10, speed: 3.5, type: 'car' },
                { row: 11, speed: -1.2, type: 'truck' }
            ];

            roadConfigs.forEach(cfg => {
                const count = cfg.type === 'truck' ? 2 : 3;
                for (let i = 0; i < count; i++) {
                    const x = (i * (canvas.width / count)) % canvas.width;
                    cars.push({
                        x: x, y: cfg.row * GRID,
                        width: cfg.type === 'truck' ? GRID * 2 : GRID,
                        height: GRID * 0.7,
                        speed: cfg.speed,
                        type: cfg.type
                    });
                }
            });

            // Water lanes (rows 1-5)
            const waterConfigs = [
                { row: 1, speed: 1.5, type: 'log', count: 3 },
                { row: 2, speed: -2.5, type: 'turtle', count: 4 },
                { row: 3, speed: 1.2, type: 'log', count: 2 },
                { row: 4, speed: -3, type: 'turtle', count: 3 },
                { row: 5, speed: 2, type: 'log', count: 2 }
            ];

            waterConfigs.forEach(cfg => {
                for (let i = 0; i < cfg.count; i++) {
                    const x = (i * (canvas.width / cfg.count)) % canvas.width;
                    if (cfg.type === 'log') {
                        logs.push({
                            x: x, y: cfg.row * GRID,
                            width: GRID * 2.5, height: GRID * 0.6,
                            speed: cfg.speed
                        });
                    } else {
                        turtles.push({
                            x: x, y: cfg.row * GRID,
                            width: GRID * 2, height: GRID * 0.6,
                            speed: cfg.speed
                        });
                    }
                }
            });
        }

        function updateUI() {
            livesEl.textContent = lives;
            scoreEl.textContent = score;
            timeEl.textContent = Math.ceil(timeLeft);
        }

        // Input
        document.addEventListener('keydown', (e) => {
            if (state === 'start' || state === 'gameover' || state === 'win') {
                if (e.key === 'Enter' || e.key === ' ') {
                    resetGame();
                    state = 'playing';
                }
                return;
            }

            if (e.key === 'p' || e.key === 'P') {
                state = state === 'paused' ? 'playing' : 'paused';
                return;
            }

            if (state !== 'playing' || frog.moving) return;

            let newX = frog.gridX, newY = frog.gridY;
            switch (e.key) {
                case 'ArrowUp': newY--; break;
                case 'ArrowDown': newY++; break;
                case 'ArrowLeft': newX--; break;
                case 'ArrowRight': newX++; break;
                default: return;
            }

            newX = Math.max(0, Math.min(COLS - 1, newX));
            newY = Math.max(0, Math.min(ROWS - 1, newY));

            frog.fromX = frog.x;
            frog.fromY = frog.y;
            frog.gridX = newX;
            frog.gridY = newY;
            frog.moving = true;
            frog.progress = 0;
        });

        window.addEventListener('resize', scaleCanvas);

        function update(dt) {
            if (state !== 'playing') return;

            // Timer
            timeAcc += dt;
            if (timeAcc >= 1000) {
                timeLeft--;
                timeAcc -= 1000;
                if (timeLeft <= 0) loseLife();
            }

            // Frog movement
            if (frog.moving) {
                frog.progress += dt * 0.012;
                frog.hop = Math.sin(frog.progress * Math.PI) * 10;

                if (frog.progress >= 1) {
                    frog.moving = false;
                    frog.progress = 0;
                    frog.x = frog.gridX * GRID;
                    frog.y = frog.gridY * GRID;
                    frog.hop = 0;
                    checkGoal();
                } else {
                    const t = frog.progress < 0.5 
                        ? 2 * frog.progress * frog.progress 
                        : -1 + (4 - 2 * frog.progress) * frog.progress;
                    frog.x = frog.fromX + (frog.gridX * GRID - frog.fromX) * t;
                    frog.y = frog.fromY + (frog.gridY * GRID - frog.fromY) * t;
                }
            }

            // Update cars
            cars.forEach(car => {
                car.x += car.speed;
                if (car.speed > 0 && car.x > canvas.width) car.x = -car.width;
                else if (car.speed < 0 && car.x + car.width < 0) car.x = canvas.width;
            });

            // Update logs
            logs.forEach(log => {
                log.x += log.speed;
                if (log.speed > 0 && log.x > canvas.width) log.x = -log.width;
                else if (log.speed < 0 && log.x + log.width < 0) log.x = canvas.width;
            });

            // Update turtles
            turtles.forEach(t => {
                t.x += t.speed;
                if (t.speed > 0 && t.x > canvas.width) t.x = -t.width;
                else if (t.speed < 0 && t.x + t.width < 0) t.x = canvas.width;
            });

            turtleAnim += dt * 0.008;

            checkCollisions();
            updateUI();
        }

        function checkCollisions() {
            const fr = { x: frog.x + 12, y: frog.y + 12, w: 26, h: 26 };

            // Road collision (rows 7-11)
            if (frog.gridY >= 7 && frog.gridY <= 11) {
                for (const car of cars) {
                    const cr = { x: car.x + 4, y: car.y + 8, w: car.width - 8, h: car.height };
                    if (overlap(fr, cr)) { loseLife(); return; }
                }
            }

            // Water collision (rows 1-5)
            if (frog.gridY >= 1 && frog.gridY <= 5) {
                let onObject = false;

                for (const log of logs) {
                    if (Math.abs(log.y - frog.y) < 10) {
                        const lr = { x: log.x, y: log.y + 10, w: log.width, h: log.height };
                        if (overlap(fr, lr)) {
                            onObject = true;
                            frog.x += log.speed;
                            frog.gridX = Math.floor(frog.x / GRID);
                            break;
                        }
                    }
                }

                if (!onObject) {
                    for (const t of turtles) {
                        if (Math.abs(t.y - frog.y) < 10) {
                            const tr = { x: t.x, y: t.y + 10, w: t.width, h: t.height };
                            if (overlap(fr, tr)) {
                                onObject = true;
                                frog.x += t.speed;
                                frog.gridX = Math.floor(frog.x / GRID);
                                break;
                            }
                        }
                    }
                }

                if (!onObject) { loseLife(); return; }
            }

            // Off screen
            if (frog.x < -20 || frog.x > canvas.width - 30) loseLife();
        }

        function overlap(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function checkGoal() {
            if (frog.gridY === 0) {
                // Check if in valid goal area (not wall)
                const goalX = (frog.gridX - 1) / 2.5;
                if (goalX < 0 || goalX > 4.5) {
                    loseLife();
                    return;
                }

                const slot = Math.floor(goalX);
                if (slot >= 0 && slot <= 4 && !goals[slot]) {
                    goals[slot] = true;
                    score += 100 + Math.floor(timeLeft * 2);

                    if (goals.every(g => g)) {
                        score += 1000;
                        state = 'win';
                    } else {
                        resetLevel();
                    }
                }
            }
        }

        function loseLife() {
            lives--;
            if (lives <= 0) {
                state = 'gameover';
            } else {
                resetLevel();
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawGoals();
            drawLogs();
            drawTurtles();
            drawCars();
            drawFrog();

            if (state === 'start') drawStartScreen();
            else if (state === 'paused') drawPauseScreen();
            else if (state === 'gameover') drawGameOver();
            else if (state === 'win') drawWin();
        }

        function drawBackground() {
            // Water (rows 1-5)
            ctx.fillStyle = '#1e3a5f';
            ctx.fillRect(0, GRID, canvas.width, GRID * 5);

            // Safe zone (row 6)
            ctx.fillStyle = '#3d5c3d';
            ctx.fillRect(0, GRID * 6, canvas.width, GRID);

            // Road (rows 7-11)
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, GRID * 7, canvas.width, GRID * 5);

            // Road lines
            ctx.strokeStyle = '#ffff00';
            ctx.setLineDash([20, 20]);
            ctx.lineWidth = 2;
            for (let i = 8; i <= 11; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * GRID);
                ctx.lineTo(canvas.width, i * GRID);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Start zone (row 12)
            ctx.fillStyle = '#3d5c3d';
            ctx.fillRect(0, GRID * 12, canvas.width, GRID);

            // Goal zone (row 0)
            ctx.fillStyle = '#3d5c3d';
            ctx.fillRect(0, 0, canvas.width, GRID);

            // Goal slots
            ctx.fillStyle = '#1a1a2e';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect((1 + i * 2.5) * GRID, 0, GRID * 2, GRID);
            }
        }

        function drawGoals() {
            for (let i = 0; i < 5; i++) {
                const x = (1 + i * 2.5) * GRID;
                if (goals[i]) {
                    // Filled frog
                    ctx.fillStyle = '#4ade80';
                    ctx.beginPath();
                    ctx.arc(x + GRID, GRID / 2, GRID * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(x + GRID - 6, GRID / 2 - 4, 4, 0, Math.PI * 2);
                    ctx.arc(x + GRID + 6, GRID / 2 - 4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(x + GRID - 6, GRID / 2 - 4, 2, 0, Math.PI * 2);
                    ctx.arc(x + GRID + 6, GRID / 2 - 4, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.strokeStyle = '#4a4a6a';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + 5, 5, GRID * 2 - 10, GRID - 10);
                }
            }
        }

        function drawLogs() {
            logs.forEach(log => {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(log.x, log.y + 10, log.width, log.height);
                ctx.fillStyle = '#a0522d';
                ctx.fillRect(log.x + 4, log.y + 14, log.width - 8, log.height - 8);
            });
        }

        function drawTurtles() {
            const submerged = Math.sin(turtleAnim) > 0.7;
            turtles.forEach(t => {
                if (submerged) {
                    ctx.fillStyle = '#2a4a4a';
                    ctx.beginPath();
                    ctx.ellipse(t.x + t.width / 2, t.y + GRID / 2, t.width / 2, GRID * 0.25, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#228b22';
                    ctx.beginPath();
                    ctx.ellipse(t.x + t.width / 2, t.y + GRID / 2, t.width / 2, GRID * 0.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2e8b2e';
                    ctx.beginPath();
                    ctx.ellipse(t.x + t.width / 2, t.y + GRID / 2, t.width / 3, GRID * 0.15, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawCars() {
            cars.forEach(car => {
                if (car.type === 'car') {
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillRect(car.x, car.y + 8, car.width, car.height * 0.5);
                    ctx.fillStyle = '#c0392b';
                    ctx.fillRect(car.x + car.width * 0.2, car.y, car.width * 0.6, car.height * 0.4);
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(car.x + car.width * 0.1, car.y + car.height * 0.7, car.width * 0.2, car.height * 0.25);
                    ctx.fillRect(car.x + car.width * 0.7, car.y + car.height * 0.7, car.width * 0.2, car.height * 0.25);
                } else {
                    ctx.fillStyle = '#3498db';
                    ctx.fillRect(car.x + car.width * 0.65, car.y + 5, car.width * 0.35, car.height * 0.7);
                    ctx.fillStyle = '#2980b9';
                    ctx.fillRect(car.x, car.y, car.width * 0.6, car.height * 0.85);
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(car.x + car.width * 0.1, car.y + car.height * 0.85, car.width * 0.15, car.height * 0.15);
                    ctx.fillRect(car.x + car.width * 0.4, car.y + car.height * 0.85, car.width * 0.15, car.height * 0.15);
                    ctx.fillRect(car.x + car.width * 0.75, car.y + car.height * 0.85, car.width * 0.15, car.height * 0.15);
                }
            });
        }

        function drawFrog() {
            const x = frog.x + GRID / 2;
            const y = frog.y + GRID / 2 - frog.hop;

            // Body
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.ellipse(x, y, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            // Legs
            ctx.fillStyle = '#22c55e';
            const legOff = Math.sin(frog.hop * 0.3) * 4;
            ctx.beginPath();
            ctx.ellipse(x - 14, y + 10 + legOff, 7, 4, -0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + 14, y + 10 + legOff, 7, 4, 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x - 10, y - 8 - legOff, 5, 3, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + 10, y - 8 - legOff, 5, 3, 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x - 7, y - 6, 6, 0, Math.PI * 2);
            ctx.arc(x + 7, y - 6, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x - 7, y - 6, 2.5, 0, Math.PI * 2);
            ctx.arc(x + 7, y - 6, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Mouth
            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y + 5, 5, 0.2, Math.PI - 0.2);
            ctx.stroke();
        }

        function drawStartScreen() {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#4ade80';
            ctx.font = 'bold 48px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('FROGGER', canvas.width / 2, canvas.height / 2 - 80);

            ctx.fillStyle = '#fff';
            ctx.font = '18px "Courier New", monospace';
            ctx.fillText('Arrow Keys - Move Frog', canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillText('Avoid cars on the road', canvas.width / 2, canvas.height / 2);
            ctx.fillText('Ride logs/turtles on river', canvas.width / 2, canvas.height / 2 + 25);
            ctx.fillText('Reach all 5 goal slots to win', canvas.width / 2, canvas.height / 2 + 50);
            ctx.fillText('P - Pause', canvas.width / 2, canvas.height / 2 + 85);

            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 22px "Courier New", monospace';
            ctx.fillText('Press ENTER or SPACE to Start', canvas.width / 2, canvas.height / 2 + 130);
        }

        function drawPauseScreen() {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 48px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            ctx.fillStyle = '#fff';
            ctx.font = '20px "Courier New", monospace';
            ctx.fillText('Press P to Resume', canvas.width / 2, canvas.height / 2 + 45);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f87171';
            ctx.font = 'bold 48px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 35);
            ctx.fillStyle = '#fff';
            ctx.font = '24px "Courier New", monospace';
            ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 15);
            ctx.fillStyle = '#fbbf24';
            ctx.font = '20px "Courier New", monospace';
            ctx.fillText('Press ENTER or SPACE to Restart', canvas.width / 2, canvas.height / 2 + 60);
        }

        function drawWin() {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#4ade80';
            ctx.font = 'bold 48px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('VICTORY!', canvas.width / 2, canvas.height / 2 - 35);
            ctx.fillStyle = '#fff';
            ctx.font = '24px "Courier New", monospace';
            ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 15);
            ctx.fillStyle = '#fbbf24';
            ctx.font = '20px "Courier New", monospace';
            ctx.fillText('Press ENTER or SPACE to Play Again', canvas.width / 2, canvas.height / 2 + 60);
        }

        // Game loop
        scaleCanvas();
        resetLevel();

        let lastTime = 0;
        function loop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
